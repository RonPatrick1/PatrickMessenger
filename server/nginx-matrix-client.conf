# Public HTTPS entry point for Patrick Messenger clients. This deliberately
# does not expose federation, Synapse administration, or Ollama.
location ^~ /_matrix/client/ {
    client_max_body_size 100m;
    proxy_pass http://127.0.0.1:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_force_ranges on;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Compatibility endpoint used by Matrix clients for encrypted media upload
# and download. Newer client media paths under /_matrix/client are covered
# above.
location ^~ /_matrix/media/ {
    client_max_body_size 100m;
    proxy_pass http://127.0.0.1:8008;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_force_ranges on;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Matrix push gateway. Sygnal receives opaque event and room IDs from Synapse
# and forwards the notification to APNs; it never receives message plaintext.
location = /_matrix/push/v1/notify {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
}
